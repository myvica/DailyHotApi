name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: whoami

      - name: Create KV Namespace (if not exists)
        id: kv-create
        run: |
          echo "Checking KV namespace..."
          NAMESPACE_NAME="DAILYHOT_CACHE"
          EXISTING_KV=$(npx wrangler kv namespace list --json | jq -r ".[] | select(.title==\"${NAMESPACE_NAME}\") | .id")
          if [ -z "$EXISTING_KV" ]; then
            echo "Creating KV namespace..."
            KV_ID=$(npx wrangler kv namespace create ${NAMESPACE_NAME} --json | jq -r ".id")
            echo "kv_id=${KV_ID}" >> $GITHUB_OUTPUT
          else
            echo "KV namespace already exists: ${EXISTING_KV}"
            echo "kv_id=${EXISTING_KV}" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update wrangler.toml with KV ID
        run: |
          sed -i "s/YOUR_KV_NAMESPACE_ID/${{ steps.kv-create.outputs.kv_id }}/" wrangler.toml
          sed -i "s/YOUR_PREVIEW_KV_ID/${{ steps.kv-create.outputs.kv_id }}/" wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
