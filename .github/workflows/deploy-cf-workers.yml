name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Update wrangler.toml with KV ID
        run: |
          KV_ID="${{ vars.KV_NAMESPACE_ID }}"
          if [ -z "$KV_ID" ]; then
            echo "⚠️ KV_NAMESPACE_ID is not set in GitHub Variables"
            echo "   Please add KV_NAMESPACE_ID to your repository Variables"
            echo "   Documentation: https://docs.github.com/en/actions/learn-github-actions/variables"
            exit 1
          fi
          echo "✅ Using KV Namespace ID: $KV_ID"
          sed -i "s/YOUR_KV_NAMESPACE_ID/${KV_ID}/g" wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
