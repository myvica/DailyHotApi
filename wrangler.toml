name = "dailyhot-api"
main = "workers/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间 - 通过 GitHub Actions 自动配置
# 本地测试时可临时填入你的 ID
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_NAMESPACE_ID"

# 环境变量
[vars]
CACHE_TTL = "3600"
REQUEST_TIMEOUT = "6000"
ALLOWED_DOMAIN = "*"
ALLOWED_HOST = "imsyy.top"
RSS_MODE = "false"
FILTER_WEIBO_ADVERTISEMENT = "false"