name = "dailyhot-api"
main = "workers/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间绑定
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_ID"

# 环境变量
[vars]
CACHE_TTL = "3600"
REQUEST_TIMEOUT = "6000"
ALLOWED_DOMAIN = "*"
ALLOWED_HOST = "imsyy.top"
RSS_MODE = "false"
FILTER_WEIBO_ADVERTISEMENT = "false"

# 生产环境配置
[env.production]
name = "dailyhot-api-prod"
vars = { ALLOWED_DOMAIN = "your-domain.com" }

# 可选：自定义域名
# routes = [
#   { pattern = "dailyhot.your-domain.com", zone_name = "your-domain.com" }
# ]
